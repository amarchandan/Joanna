name: PyLint2
 
on:
  push:
  pull_request:
    branches: 
      - main
permissions: write-all
jobs:
  PEP8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
 
      - name: Setup Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.8
 
      - name: Install Python lint libraries
        run: |
          pip install autopep8 autoflake isort black && pip install -r requirements.txt
      - name: Check for showstoppers
        run: |
          autopep8 --verbose --in-place --recursive --aggressive --aggressive --ignore=W605. *.py
      - name: Remove unused imports and variables
        run: |
          autoflake --in-place --recursive --remove-all-unused-imports --remove-unused-variables --ignore-init-module-imports .
      - name: lint with isort and black
        run: |
          isort .
          black .
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          token: ${{ secrets.SOME_TOKEN }}
          commit_message: 'Auto Fixes: Code formatted'
          commit_options: '--no-verify'
          repository: .
          commit_user_name: amarchandan
          commit_user_email: amaramar6082@gmail.com
          commit_author: amarchandan <amaramar6082@gmail.com>
          body: Pylint found some issues in the code. This PR fixes those issues automatically.
          title: Auto-fix Pylint issues
